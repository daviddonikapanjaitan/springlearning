spring.application.name=springlearning

# PostgreSQL (defaults target local run against docker-compose services)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/springlearning}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Schema is managed by Flyway (src/main/resources/db/migration); Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=springlearning
spring.kafka.consumer.auto-offset-reset=earliest
