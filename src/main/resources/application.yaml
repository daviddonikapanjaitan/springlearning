spring:
  application:
    name: springlearning

  # Loads local secrets (OPENROUTER_API_KEY) from the git-ignored .env file in the working directory.
  # "optional:" keeps startup working when the value comes from a real environment variable instead (e.g. Docker).
  config:
    import: "optional:file:.env[.properties]"

  # Users only log in through POST /api/auth/login (JWT), so Spring Boot's default in-memory user is not created
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

  # PostgreSQL (defaults target local run against docker-compose services)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/springlearning}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  # Flyway is off: run the scripts in db/migration manually (e.g. with DBeaver)
  flyway:
    enabled: false

  # Hibernate only validates the schema against the entities, it never changes it
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # Kafka
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: springlearning
      auto-offset-reset: earliest

  # Spring AI through OpenRouter's OpenAI-compatible API
  ai:
    openai:
      api-key: ${OPENROUTER_API_KEY}
      base-url: https://openrouter.ai/api/v1
      chat:
        model: deepseek/deepseek-v4-flash-0731
        # Deterministic answers: the report only needs exact numbers
        temperature: 0
    # Only the chat model is used, so the other OpenAI model types are not created
    model:
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none

# Application settings
app:
  cache:
    orders:
      # How long a cached order list page lives in Redis (e.g. 30m, 1h, 90s)
      ttl: 30m
  security:
    jwt:
      # Base64-encoded HMAC-SHA key of at least 32 bytes (256 bits), from .env or an environment variable
      secret: ${JWT_SECRET}
      # How long an access token is valid
      expiration: 1h
      # How often tokens past their expiry are marked expired and revoked in the tokens table
      expired-cleanup-interval: 5m
